<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" font-family="'JetBrains Mono','Cascadia Code',Consolas,'Courier New',monospace"><defs><style>.n{opacity:0;animation:up .6s cubic-bezier(.2,.8,.2,1) forwards}@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}.flow{stroke-dasharray:6 8;animation:fl 1s linear infinite}@keyframes fl{to{stroke-dashoffset:-14}}.glow{animation:gl 2.6s ease-in-out infinite}@keyframes gl{50%{opacity:.35}}</style><radialGradient id="g" cx="1" cy="0" r="1"><stop offset="0" stop-color="#00ff9c" stop-opacity=".22"/><stop offset=".6" stop-color="#00ff9c" stop-opacity="0"/></radialGradient><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity=".035"/></pattern><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="8"/></filter></defs><rect width="1280" height="440" rx="18" fill="#0b0f17"/><rect width="1280" height="440" rx="18" fill="url(#grid)"/><rect width="1280" height="440" rx="18" fill="url(#g)"/><rect x="48" y="44" width="6" height="58" rx="3" fill="#00ff9c"/><text x="72" y="70" font-size="13" letter-spacing="4" fill="#6e7681">NJUJ / TOOL</text><text x="72" y="104" font-size="40" font-weight="800" fill="#f0f3f6">headerguard</text><text x="72" y="140" font-size="17" fill="#00ff9c">Grade a website&#x27;s security headers from one request, then write the fix.</text><g class="n" style="animation-delay:0.25s"><rect x="72" y="196" width="266" height="168" rx="14" fill="#111722" stroke="#1f2a3a" stroke-width="1.2"/><text x="320" y="226" text-anchor="end" font-size="12" fill="#3d4757">01</text><g transform="translate(92 216) scale(1.6)" fill="none" stroke="#00ff9c" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.5 3 14.5 0 18M12 3c-3 3.5-3 14.5 0 18"/></g><text x="92" y="294" font-size="17" font-weight="700" fill="#f0f3f6">One URL</text><text x="92" y="322" font-size="13" fill="#8b949e">one request:</text><text x="92" y="342" font-size="13" fill="#8b949e">headers, TLS, HTML</text></g><path class="flow" d="M342 280.0 H370" stroke="#00ff9c" stroke-width="2" fill="none" opacity=".8"/><path d="M364 275.0 l6 5 -6 5" stroke="#00ff9c" stroke-width="2" fill="none"/><g class="n" style="animation-delay:0.60s"><rect x="376" y="196" width="266" height="168" rx="14" fill="#111722" stroke="#1f2a3a" stroke-width="1.2"/><text x="624" y="226" text-anchor="end" font-size="12" fill="#3d4757">02</text><g transform="translate(396 216) scale(1.6)" fill="none" stroke="#00ff9c" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h12M9 12h12M9 18h12M4 6h.5M4 12h.5M4 18h.5"/></g><text x="396" y="294" font-size="17" font-weight="700" fill="#f0f3f6">Headers + page</text><text x="396" y="322" font-size="13" fill="#8b949e">CSP, cookies, SRI,</text><text x="396" y="342" font-size="13" fill="#8b949e">mixed content, forms</text></g><path class="flow" d="M646 280.0 H674" stroke="#00ff9c" stroke-width="2" fill="none" opacity=".8"/><path d="M668 275.0 l6 5 -6 5" stroke="#00ff9c" stroke-width="2" fill="none"/><g class="n" style="animation-delay:0.95s"><rect x="680" y="196" width="266" height="168" rx="14" fill="#111722" stroke="#1f2a3a" stroke-width="1.2"/><text x="928" y="226" text-anchor="end" font-size="12" fill="#3d4757">03</text><g transform="translate(700 216) scale(1.6)" fill="none" stroke="#00ff9c" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 17a9 9 0 1 1 17 0"/><path d="M12 14l4.5-5"/><circle cx="12" cy="14" r="1.5"/></g><text x="700" y="294" font-size="17" font-weight="700" fill="#f0f3f6">Letter grade</text><text x="700" y="322" font-size="13" fill="#8b949e">A+ to F; CI can fail</text><text x="700" y="342" font-size="13" fill="#8b949e">on a low grade</text></g><path class="flow" d="M950 280.0 H978" stroke="#00ff9c" stroke-width="2" fill="none" opacity=".8"/><path d="M972 275.0 l6 5 -6 5" stroke="#00ff9c" stroke-width="2" fill="none"/><g class="n" style="animation-delay:1.30s"><rect class="glow" x="984" y="196" width="266" height="168" rx="14" fill="#00ff9c" opacity=".18" filter="url(#sh)"/><rect x="984" y="196" width="266" height="168" rx="14" fill="#111722" stroke="#00ff9c" stroke-width="2"/><text x="1232" y="226" text-anchor="end" font-size="12" fill="#3d4757">04</text><g transform="translate(1004 216) scale(1.6)" fill="none" stroke="#00ff9c" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8 7l-5 5 5 5M16 7l5 5-5 5M14 4l-4 16"/></g><text x="1004" y="294" font-size="17" font-weight="700" fill="#f0f3f6">Writes the fix</text><text x="1004" y="322" font-size="13" fill="#8b949e">nginx, apache, caddy;</text><text x="1004" y="342" font-size="13" fill="#8b949e">CSP built from the page</text></g><g class="n" style="animation-delay:1.8s"><rect x="72" y="378" width="151" height="28" rx="14" fill="none" stroke="#00ff9c" stroke-opacity=".5"/><text x="148" y="397" text-anchor="middle" font-size="12.5" fill="#00ff9c">zero dependencies</text></g><g class="n" style="animation-delay:1.8s"><rect x="233.2" y="378" width="182" height="28" rx="14" fill="none" stroke="#00ff9c" stroke-opacity=".5"/><text x="324" y="397" text-anchor="middle" font-size="12.5" fill="#00ff9c">CSP checked in Chrome</text></g><g class="n" style="animation-delay:1.8s"><rect x="424.79999999999995" y="378" width="83" height="28" rx="14" fill="none" stroke="#00ff9c" stroke-opacity=".5"/><text x="466" y="397" text-anchor="middle" font-size="12.5" fill="#00ff9c">41 tests</text></g><rect x=".5" y=".5" width="1279" height="439" rx="18" fill="none" stroke="#1b2533"/></svg>